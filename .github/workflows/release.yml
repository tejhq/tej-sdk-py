name: release

# Publishes to PyPI on a tag of the shape v*.*.*. Uses PyPI Trusted Publishers
# (OIDC) so no API token is stored in the repo. Configure once at:
# https://pypi.org/manage/project/tejhq/settings/publishing/
#   owner: tejhq
#   repo: tej-sdk-py
#   workflow: release.yml
#   environment: pypi

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import re; print(re.search(r'\"(.+)\"', open('src/tej/_version.py').read()).group(1))")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG_VERSION != package $PKG_VERSION" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
